<VirtualHost *:80>
    ServerName campuscoffee.duckdns.org

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Certbot copies this rule into the HTTPS virtual host. It tells ASP.NET
    # to create confirmation links with https when the request arrived over TLS.
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ErrorLog ${APACHE_LOG_DIR}/campuscoffee-error.log
    CustomLog ${APACHE_LOG_DIR}/campuscoffee-access.log combined
</VirtualHost>
