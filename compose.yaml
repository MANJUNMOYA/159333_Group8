name: 159333_group8

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campus-coffee-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Keep the existing database password in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 3g

  web:
    build: .
    container_name: campus-coffee-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DisableHttpsRedirection: "true"
      PublicBaseUrl: ${PUBLIC_BASE_URL:-https://campuscoffee.duckdns.org}
      DataProtection__KeysPath: /app/data-protection-keys
      ConnectionStrings__DefaultConnection: "Server=db;Database=CampusCoffeeSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Campus Coffee}
      Notifications__Enabled: ${NOTIFICATIONS_ENABLED:-true}
      Notifications__MerchantReviewEmail: ${MERCHANT_REVIEW_EMAIL:-}
      Gemini__Enabled: ${GEMINI_ENABLED:-false}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CoffeeModel__Enabled: ${COFFEE_MODEL_ENABLED:-true}
      CoffeeModel__BaseUrl: http://ollama:11434/
      CoffeeModel__Model: ${COFFEE_MODEL_NAME:-qwen2.5:0.5b-instruct}
      CoffeeModel__PublicApiKey: ${COFFEE_MODEL_API_KEY:-}
      CoffeeModel__TimeoutSeconds: "90"
    depends_on:
      db:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - data-protection-keys:/app/data-protection-keys
      - uploads-data:/app/wwwroot/uploads

  ollama:
    image: ollama/ollama:latest
    container_name: campus-coffee-ai
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama-data:/root/.ollama

# Keep the original project and volume names: never delete these to update the web app.
volumes:
  sqlserver-data:
  data-protection-keys:
  uploads-data:
  ollama-data:
