name: 159333_group8

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campus-coffee-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Keep the existing database password in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 3g

  web:
    build: .
    container_name: campus-coffee-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DisableHttpsRedirection: "true"
      PublicBaseUrl: ${PUBLIC_BASE_URL:-https://campuscoffee.duckdns.org}
      DataProtection__KeysPath: /app/data-protection-keys
      ConnectionStrings__DefaultConnection: "Server=db;Database=CampusCoffeeSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:?Keep the sending address in .env}
      Smtp__Password: ${SMTP_PASSWORD:?Keep the SMTP credential in .env}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:?Keep the sender address in .env}
      Smtp__FromName: ${SMTP_FROM_NAME:-Campus Coffee}
    depends_on:
      db:
        condition: service_started
    volumes:
      - data-protection-keys:/app/data-protection-keys
      - uploads-data:/app/wwwroot/uploads

# Keep the original project and volume names: never delete these to update the web app.
volumes:
  sqlserver-data:
  data-protection-keys:
  uploads-data:
