services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campus-coffee-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 3g

  web:
    build: .
    container_name: campus-coffee-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DisableHttpsRedirection: "true"
      PersistDataProtectionKeys: "true"
      ConnectionStrings__DefaultConnection: "Server=db;Database=CampusCoffeeSystem;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
    depends_on:
      db:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - data-protection-keys:/app/data-protection-keys

  ollama:
    image: ollama/ollama:latest
    container_name: campus-coffee-ai
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 2g

  ollama-init:
    image: ollama/ollama:latest
    container_name: campus-coffee-ai-init
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while ! ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull "$${OLLAMA_MODEL}"

volumes:
  sqlserver-data:
  data-protection-keys:
  ollama-data:
